<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0d1117" />
<title>Painel de ativação · Plataforma Casillas</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --field: #0d1117; --line: #30363d; --text: #e6edf3; --soft: #8b949e;
    --brand: #f0883e; --blue: #58a6ff; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  header img { height: 26px; }
  header .who { margin-left: auto; font-size: 12px; color: var(--soft); text-align: right; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--soft); }
  input, select, textarea { font: inherit; font-size: 16px; color: var(--text); background: var(--field);
           border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 60px; resize: vertical; }
  button { font: inherit; min-height: 40px; padding: 8px 14px; border-radius: 9px; cursor: pointer;
           background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.primary { background: var(--brand); color: #0d1117; border-color: var(--brand); font-weight: 600; }
  button.danger { color: #ff7b72; border-color: #da3633; }
  button.small { min-height: 32px; padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: .55; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1 1 140px; }
  .row > button { flex: 0 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .muted { color: var(--soft); font-size: 13px; }
  .msg { padding: 10px 12px; border-radius: 9px; font-size: 14px; display: none; }
  .msg.ok { display: block; background: rgba(63,185,80,.12); color: #7ee787; }
  .msg.bad { display: block; background: rgba(248,81,73,.14); color: #ffa198; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
  .b-ok { background: rgba(63,185,80,.15); color: #7ee787; }
  .b-trial { background: rgba(88,166,255,.15); color: #79c0ff; }
  .b-bad { background: rgba(248,81,73,.15); color: #ffa198; }
  .b-off { background: rgba(139,148,158,.18); color: var(--soft); }
  .customer { display: flex; flex-direction: column; gap: 10px; }
  .customer .top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .customer .email { font-weight: 600; word-break: break-all; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .item .grow { flex: 1 1 200px; }
  details > summary { cursor: pointer; color: var(--blue); font-size: 14px; }
  .hidden { display: none !important; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .stat { background: var(--field); border: 1px solid var(--line); border-radius: 9px; padding: 8px; text-align: center; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: var(--soft); }
  @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <img src="./assinatura.svg" alt="Casillas" />
  <span class="muted">Painel de ativação</span>
  <div class="who" id="who"></div>
</header>

<main>
  <section class="card" id="login">
    <h2>Entrar como administrador</h2>
    <div class="list">
      <label>E-mail <input id="l-email" type="email" autocomplete="username" /></label>
      <label>Senha <input id="l-pass" type="password" autocomplete="current-password" /></label>
      <div class="msg" id="l-msg"></div>
      <button class="primary" id="l-go">Entrar</button>
    </div>
  </section>

  <section id="panel" class="hidden" style="display:flex;flex-direction:column;gap:14px">
    <div class="card"><div class="stats" id="stats"></div></div>

    <div class="card">
      <h2>Gerar códigos de licença</h2>
      <div class="grid">
        <label>Produto
          <select id="g-prod">
            <option value="pacote-completo">Pacote completo (todos os módulos)</option>
            <option value="code">Casillas Code</option>
            <option value="academy">Casillas Academy</option>
            <option value="macro">Casillas Macro</option>
            <option value="otimizador">Casillas Otimizador</option>
            <option value="casillas">Casillas Calculadoras</option>
          </select>
        </label>
        <label>Tipo
          <select id="g-kind"><option value="sub">Assinatura (dias de validade)</option><option value="perp">Vitalícia (só Academy e Calculadoras)</option></select>
        </label>
        <label id="g-days-l">Dias de validade
          <select id="g-days"><option>30</option><option>90</option><option>180</option><option selected>365</option><option value="730">730</option></select>
        </label>
        <label id="g-upd-l" class="hidden">Meses de atualização
          <input id="g-upd" type="number" min="1" max="120" value="12" />
        </label>
        <label>Quantidade <input id="g-qty" type="number" min="1" max="100" value="1" /></label>
      </div>
      <label style="margin-top:10px">Anotação (cliente, forma de pagamento…) <input id="g-note" maxlength="120" /></label>
      <div class="msg" id="g-msg" style="margin-top:10px"></div>
      <div class="row" style="margin-top:10px"><button class="primary" id="g-go">Gerar</button></div>
      <div id="g-out" class="list" style="margin-top:10px"></div>
      <div class="muted" id="g-hint"></div>
    </div>

    <div class="card">
      <h2>Clientes</h2>
      <div class="row">
        <label>Procurar por e-mail <input id="q" type="search" placeholder="ex.: joao@" /></label>
        <label style="flex:0 0 150px">Mostrar
          <select id="filter"><option value="all">Todos</option><option value="trial">Em teste</option><option value="licensed">Com licença</option><option value="expired">Teste encerrado</option></select>
        </label>
        <button id="reload">Atualizar</button>
      </div>
      <div class="msg" id="p-msg" style="margin-top:10px"></div>
      <div id="customers" class="list" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>Licenças</h2>
      <div class="muted">Os códigos aparecem só na hora de gerar. Aqui ficam o estado e a anotação.</div>
      <div id="licenses" class="list" style="margin-top:10px"></div>
    </div>

    <div class="card"><div class="row"><button class="danger" id="logout">Sair</button></div></div>
  </section>
</main>

<script>
'use strict';
const SUPABASE_URL = 'https://maayjshlsxvxtrgjpcep.supabase.co'; // projeto "Casillas": conta única da plataforma
const SUPABASE_KEY = 'sb_publishable_1p4-6-tNmiBhz0edN-UQDQ_sbwJwABo';
const $ = id => document.getElementById(id);
const PRODUCT_NAMES = { 'pacote-completo': 'Pacote completo', code: 'Code', academy: 'Academy', macro: 'Macro', otimizador: 'Otimizador', casillas: 'Calculadoras', cam: 'CAM', biblioteca: 'Biblioteca', plataforma: 'Teste' };
let session = null;
let customers = [];

async function call(path, { method = 'GET', body } = {}) {
  if (session && session.expires_at - 60 < Date.now() / 1000) await refresh();
  const headers = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };
  if (session) headers.Authorization = 'Bearer ' + session.access_token;
  const r = await fetch(SUPABASE_URL + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  const text = await r.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!r.ok) { const e = new Error((data && (data.msg || data.message || data.error_description || data.error)) || 'erro ' + r.status); e.code = data && data.code; throw e; }
  return data;
}
const rpc = (name, args) => call('/rest/v1/rpc/' + name, { method: 'POST', body: args || {} });

function keep(data, email) {
  session = { access_token: data.access_token, refresh_token: data.refresh_token,
    expires_at: data.expires_at || Math.floor(Date.now() / 1000) + (data.expires_in || 3600), email: email || (data.user && data.user.email) };
  sessionStorage.setItem('cc.admin2', JSON.stringify(session)); // só nesta aba: fechou, saiu
}
async function refresh() {
  const r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', { method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: session.refresh_token }) });
  if (!r.ok) { logout(); throw new Error('Sessão expirada: entre de novo.'); }
  keep(await r.json(), session.email);
}
function logout() { sessionStorage.removeItem('cc.admin2'); session = null; location.reload(); }

const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') : '—';
const fmtDateTime = iso => iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function show(el, text, ok) { el.textContent = text; el.className = 'msg ' + (text ? (ok ? 'ok' : 'bad') : ''); }

function stateOf(c) {
  const now = Date.now();
  const active = (c.entitlements || []).filter(e => e.status === 'ACTIVE' && (!e.valid_until || Date.parse(e.valid_until) > now));
  if (active.length) return { key: 'licensed', label: 'Com licença (' + active.map(e => PRODUCT_NAMES[e.product] || e.product).join(', ') + ')', cls: 'b-ok' };
  if (c.trial && Date.parse(c.trial.ends_at) > now) {
    const d = Math.ceil((Date.parse(c.trial.ends_at) - now) / 86400000);
    return { key: 'trial', label: 'Teste: ' + d + (d === 1 ? ' dia' : ' dias'), cls: 'b-trial' };
  }
  return { key: 'expired', label: c.trial ? 'Teste encerrado' : 'Sem teste iniciado', cls: 'b-bad' };
}

async function login() {
  const email = $('l-email').value.trim().toLowerCase(), pass = $('l-pass').value;
  show($('l-msg'), ''); $('l-go').disabled = true;
  try {
    keep(await call('/auth/v1/token?grant_type=password', { method: 'POST', body: { email, password: pass } }), email);
    await enter();
  } catch (e) { show($('l-msg'), /invalid login/i.test(e.message) ? 'E-mail ou senha incorretos.' : e.message); }
  finally { $('l-go').disabled = false; }
}

async function enter() {
  try { customers = await rpc('platform_admin_overview_v1'); }
  catch (e) {
    sessionStorage.removeItem('cc.admin2'); session = null;
    show($('l-msg'), e.code === '42501' || /negado/i.test(e.message) ? 'Esta conta não é de administrador.' : e.message);
    return;
  }
  $('login').classList.add('hidden'); $('panel').classList.remove('hidden');
  $('who').textContent = session.email;
  render(); loadLicenses();
}

function render() {
  const counts = { all: customers.length, trial: 0, licensed: 0, expired: 0 };
  customers.forEach(c => { counts[stateOf(c).key]++; });
  $('stats').innerHTML = [['Contas', counts.all], ['Em teste', counts.trial], ['Com licença', counts.licensed], ['Encerrados', counts.expired]]
    .map(([l, n]) => '<div class="stat"><b>' + n + '</b><span>' + l + '</span></div>').join('');
  const q = $('q').value.trim().toLowerCase(), f = $('filter').value;
  const list = customers.filter(c => (!q || (c.email || '').toLowerCase().includes(q)) && (f === 'all' || stateOf(c).key === f));
  const box = $('customers');
  if (!list.length) { box.innerHTML = '<div class="muted">Nenhuma conta encontrada.</div>'; return; }
  box.innerHTML = list.map(c => {
    const st = stateOf(c);
    const ents = (c.entitlements || []).map(e => '<div>' + esc(PRODUCT_NAMES[e.product] || e.product) + ' · ' + esc(e.status) + ' · ' +
      (e.valid_until ? 'até ' + fmtDate(e.valid_until) : 'vitalícia' + (e.updates_until ? ' (atualizações até ' + fmtDate(e.updates_until) + ')' : '')) + '</div>').join('');
    const devs = (c.devices || []).map(d => '<div class="item"><span class="grow">' + esc(d.label || d.platform) + ' · ' + esc(String(d.device_id).slice(0, 8)) +
      ' · visto ' + fmtDateTime(d.last_seen) + (d.revoked ? ' · <b>liberado</b>' : '') + '</span>' +
      (d.revoked ? '' : '<button class="small danger" data-rel="' + esc(c.user_id) + '|' + esc(d.device_id) + '">Liberar aparelho</button>') + '</div>').join('');
    return '<div class="card customer"><div class="top"><div><div class="email">' + esc(c.email) + '</div><div class="muted">Criada em ' + fmtDate(c.created_at) +
      ' · último acesso ' + fmtDateTime(c.last_sign_in) + '</div></div><span class="badge ' + st.cls + '">' + esc(st.label) + '</span></div>' +
      (ents ? '<div class="muted">' + ents + '</div>' : '') + (devs ? '<details><summary>Aparelhos (' + c.devices.filter(d => !d.revoked).length + ' de 2)</summary><div class="list">' + devs + '</div></details>' : '') + '</div>';
  }).join('');
  box.querySelectorAll('[data-rel]').forEach(b => b.addEventListener('click', async () => {
    const [u, d] = b.dataset.rel.split('|'); b.disabled = true;
    try { await rpc('platform_admin_release_device_v1', { p_user_id: u, p_device_id: d }); await reload(); } catch (e) { show($('p-msg'), e.message); }
  }));
}

async function loadLicenses() {
  try {
    const ls = await rpc('platform_admin_licenses_v1');
    const names = { AVAILABLE: ['Disponível', 'b-trial'], ACTIVE: ['Ativa', 'b-ok'], REVOKED: ['Revogada', 'b-bad'] };
    $('licenses').innerHTML = ls.length ? ls.map(l => '<div class="item"><span class="grow"><b>' + esc(PRODUCT_NAMES[l.product] || l.product) + '</b> · ' +
      (l.valid_days ? l.valid_days + ' dias' : 'vitalícia' + (l.updates_months ? ' + ' + l.updates_months + ' meses de atualização' : '')) +
      (l.note ? ' · ' + esc(l.note) : '') + '<br><span class="muted">criada ' + fmtDate(l.created_at) + (l.activated_by_email ? ' · ativada por ' + esc(l.activated_by_email) + ' em ' + fmtDate(l.activated_at) : '') + '</span></span>' +
      '<span class="badge ' + names[l.status][1] + '">' + names[l.status][0] + '</span>' +
      (l.status === 'REVOKED' ? '' : '<button class="small danger" data-rev="' + esc(l.id) + '">' + (l.status === 'AVAILABLE' ? 'Cancelar código' : 'Revogar') + '</button>') + '</div>').join('')
      : '<div class="muted">Nenhuma licença gerada ainda.</div>';
    $('licenses').querySelectorAll('[data-rev]').forEach(b => b.addEventListener('click', async () => {
      if (!confirm(b.textContent + '? Isso não pode ser desfeito.')) return;
      b.disabled = true;
      try { await rpc('platform_admin_revoke_license_v1', { p_license_id: b.dataset.rev }); await reload(); } catch (e) { show($('p-msg'), e.message); }
    }));
  } catch (e) { $('licenses').innerHTML = '<div class="msg bad">' + esc(e.message) + '</div>'; }
}

async function reload() { customers = await rpc('platform_admin_overview_v1'); render(); loadLicenses(); }

function syncKind() {
  const perp = $('g-kind').value === 'perp';
  $('g-days-l').classList.toggle('hidden', perp); $('g-upd-l').classList.toggle('hidden', !perp);
}

async function generate() {
  show($('g-msg'), ''); $('g-out').innerHTML = ''; $('g-go').disabled = true;
  const perp = $('g-kind').value === 'perp';
  try {
    const r = await rpc('platform_admin_create_licenses_v1', {
      p_product_slug: $('g-prod').value, p_count: parseInt($('g-qty').value, 10) || 1,
      p_valid_days: perp ? null : parseInt($('g-days').value, 10),
      p_updates_months: perp ? parseInt($('g-upd').value, 10) || null : null,
      p_note: $('g-note').value.trim() || null });
    $('g-out').innerHTML = r.codes.map(c => '<div class="item"><code class="grow" style="font-size:17px;letter-spacing:1px">' + esc(c) + '</code><button class="small" data-copy="' + esc(c) + '">Copiar</button></div>').join('');
    $('g-out').querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => { navigator.clipboard.writeText(b.dataset.copy).then(() => { b.textContent = 'Copiado'; }); }));
    $('g-hint').textContent = 'Guarde agora: os códigos não aparecem de novo. O cliente digita em Arquivos › Conta › "Tem um código de licença?".';
    show($('g-msg'), r.count + (r.count === 1 ? ' código gerado.' : ' códigos gerados.'), true);
    loadLicenses();
  } catch (e) { show($('g-msg'), e.message); }
  finally { $('g-go').disabled = false; }
}

$('l-go').addEventListener('click', login);
$('l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('logout').addEventListener('click', logout);
$('reload').addEventListener('click', () => reload().catch(e => show($('p-msg'), e.message)));
$('q').addEventListener('input', render); $('filter').addEventListener('change', render);
$('g-kind').addEventListener('change', syncKind); $('g-go').addEventListener('click', generate);
$('g-prod').addEventListener('change', () => {
  const ok = ['academy', 'casillas'].includes($('g-prod').value);
  $('g-kind').querySelector('option[value=perp]').disabled = !ok;
  if (!ok) { $('g-kind').value = 'sub'; syncKind(); }
});
$('g-prod').dispatchEvent(new Event('change'));
try { const saved = JSON.parse(sessionStorage.getItem('cc.admin2') || 'null'); if (saved) { session = saved; enter().catch(() => {}); } } catch { /* sem sessão */ }
</script>
</body>
</html>
