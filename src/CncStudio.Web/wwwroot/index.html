<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Casillas Code — editor e simulador CNC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" type="image/png" href="./icone.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/icone-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Casillas Code" />
  <link rel="stylesheet" href="./app.css" />
  <script type="module" src="./main.js"></script>
  <script>
    // App instalável e funcionamento offline (só em https ou localhost)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
    }
  </script>
</head>
<body>
  <div id="out">
    <div class="avalonia-splash">
      <img src="./assinatura.svg" alt="Casillas Code" />
      <div class="bar"></div>
      <div>Carregando…</div>
    </div>
  </div>
</body>
</html>
