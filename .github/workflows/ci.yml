# Integração contínua: compila, roda os testes e gera o executável para Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para publicar as fotos da interface no ramo ci-screenshots
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore -c Release

      - name: Testes
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      - name: Fotos da interface (headless)
        run: dotnet run --project tools/CncStudio.Screenshots -c Release -- screenshots
        continue-on-error: true

      - name: Anexar fotos da interface
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: screenshots
          retention-days: 7
        continue-on-error: true

      - name: Publicar fotos no ramo ci-screenshots
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Fotos da interface (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Publicar executável Windows (x64)
        run: >
          dotnet publish src/CncStudio.App/CncStudio.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=1.0.${{ github.run_number }}
          -o publish/CncStudio-win-x64

      - name: Anexar executável ao resultado do CI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CasillasCode-win-x64
          path: publish/CncStudio-win-x64
          retention-days: 30

  # Instalador (Inno Setup) a partir do executável publicado acima
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CasillasCode-win-x64
          path: publish/CncStudio-win-x64

      - name: Gerar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=1.0.${{ github.run_number }} installer\CncStudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Anexar instalador ao resultado do CI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CasillasCode-Setup
          path: installer-output/*.exe
          retention-days: 30

  # Versão web (Avalonia em WebAssembly): compila e publica os arquivos no ramo ci-web
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para publicar a versão web no ramo ci-web
    env:
      # Publicação no Cloudflare Pages (só acontece quando os dois segredos existem no repositório)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Instalar ferramentas de WebAssembly
        run: dotnet workload install wasm-tools

      - name: Publicar versão web
        run: |
          dotnet publish src/CncStudio.Web/CncStudio.Web.csproj -c Release -o publish/web -p:Version=1.0.${{ github.run_number }}
          # Número da versão na página (tela de carregamento) e no arquivo que o app consulta para saber se há versão nova
          sed -i "s/__APP_VERSION__/1.0.${{ github.run_number }}/g" publish/web/wwwroot/index.html
          rm -f publish/web/wwwroot/index.html.br publish/web/wwwroot/index.html.gz
          echo "1.0.${{ github.run_number }}" > publish/web/wwwroot/version.txt

      - name: Conferir arquivos gerados
        run: |
          ls -la publish/web/wwwroot
          du -sh publish/web/wwwroot publish/web/wwwroot/_framework

      - name: Anexar versão web
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CasillasCode-web
          path: publish/web/wwwroot
          retention-days: 14

      - name: Publicar no ramo ci-web
        if: github.event_name == 'push'
        run: |
          cd publish/web/wwwroot
          touch .nojekyll
          git init -q -b ci-web
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Versão web (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-web

      - name: Preparar site (sem as cópias pré-comprimidas; o Cloudflare comprime sozinho)
        run: |
          mkdir -p site
          rsync -a --exclude '*.br' --exclude '*.gz' --exclude '.git' --exclude '.nojekyll' publish/web/wwwroot/ site/
          du -sh site

      - name: Publicar no Cloudflare Pages (app instalável)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@3 pages project create casillas-code --production-branch main || true
          npx --yes wrangler@3 pages deploy site --project-name casillas-code --branch main --commit-dirty=true

      - name: Publicar o painel de ativação (endereço separado, sem link no app)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@3 pages project create casillas-code-painel --production-branch main || true
          npx --yes wrangler@3 pages deploy admin --project-name casillas-code-painel --branch main --commit-dirty=true
