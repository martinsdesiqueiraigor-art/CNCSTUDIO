# Integração contínua: compila, roda os testes e gera o executável para Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para publicar as fotos da interface no ramo ci-screenshots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar pacotes
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore -c Release

      - name: Testes
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

      - name: Fotos da interface (headless)
        run: dotnet run --project tools/CncStudio.Screenshots -c Release -- screenshots
        continue-on-error: true

      - name: Anexar fotos da interface
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          retention-days: 7
        continue-on-error: true

      - name: Publicar fotos no ramo ci-screenshots
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Fotos da interface (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Publicar executável Windows (x64)
        run: >
          dotnet publish src/CncStudio.App/CncStudio.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -p:Version=1.0.${{ github.run_number }}
          -o publish/CncStudio-win-x64

      - name: Anexar executável ao resultado do CI
        uses: actions/upload-artifact@v4
        with:
          name: CncStudio-win-x64
          path: publish/CncStudio-win-x64
          retention-days: 30

  # Instalador (Inno Setup) a partir do executável publicado acima
  installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: CncStudio-win-x64
          path: publish/CncStudio-win-x64

      - name: Gerar instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=1.0.${{ github.run_number }} installer\CncStudio.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Anexar instalador ao resultado do CI
        uses: actions/upload-artifact@v4
        with:
          name: CncStudio-Setup
          path: installer-output/*.exe
          retention-days: 30
