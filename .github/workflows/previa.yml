# Prévia de desenvolvimento: a cada push num ramo de trabalho, roda os testes, publica a web numa
# prévia do Cloudflare Pages (https://<ramo>.casillas-code.pages.dev) e anexa o .exe de teste.
# Nunca publica a versão oficial: o ramo de produção do Cloudflare é o main, e este fluxo não roda no main.
name: Prévia

on:
  push:
    branches: ['fase-*', 'ajuste-*', 'dev', 'ext-*']
  workflow_dispatch:

concurrency:
  group: previa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compilar e testar
        run: |
          dotnet build -c Release
          dotnet test --no-build -c Release

  web:
    needs: testes
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Instalar ferramentas de WebAssembly
        run: dotnet workload install wasm-tools
      - name: Publicar versão web
        run: |
          dotnet publish src/CncStudio.Web/CncStudio.Web.csproj -c Release -o publish/web -p:Version=0.0.${{ github.run_number }}
          VERSAO="prévia ${GITHUB_REF_NAME} #${{ github.run_number }}"
          sed -i "s/__APP_VERSION__/${VERSAO}/g" publish/web/wwwroot/index.html
          rm -f publish/web/wwwroot/index.html.br publish/web/wwwroot/index.html.gz
          echo "${VERSAO}" > publish/web/wwwroot/version.txt
          mkdir -p site
          rsync -a --exclude '*.br' --exclude '*.gz' publish/web/wwwroot/ site/
      - name: Publicar prévia no Cloudflare Pages (não é a versão oficial)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@3 pages deploy site --project-name casillas-code --branch "${GITHUB_REF_NAME}" --commit-dirty=true
          ALIAS=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "### Prévia web: https://${ALIAS}.casillas-code.pages.dev" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: testes
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Executável de teste para Windows
        run: >
          dotnet publish src/CncStudio.App/CncStudio.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/teste-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CasillasCode-teste-${{ github.ref_name }}
          path: publish/teste-win-x64
          retention-days: 14
