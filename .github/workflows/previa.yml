# Prévia de desenvolvimento: a cada push num ramo de trabalho, roda os testes, publica a web numa
# prévia do Cloudflare Pages (https://<ramo>.casillas-code.pages.dev) e anexa o .exe de teste.
# Nunca publica a versão oficial: o ramo de produção do Cloudflare é o main, e este fluxo não roda no main.
name: Prévia

on:
  push:
    branches: ['fase-*', 'ajuste-*', 'dev', 'ext-*']
  workflow_dispatch:

concurrency:
  group: previa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Compilar e testar
        run: |
          dotnet build -c Release
          dotnet test --no-build -c Release

  web:
    needs: testes
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Instalar ferramentas de WebAssembly
        run: dotnet workload install wasm-tools
      - name: Publicar versão web
        run: |
          dotnet publish src/CncStudio.Web/CncStudio.Web.csproj -c Release -o publish/web -p:Version=0.0.${{ github.run_number }}
          VERSAO="prévia ${GITHUB_REF_NAME} #${{ github.run_number }}"
          sed -i "s/__APP_VERSION__/${VERSAO}/g" publish/web/wwwroot/index.html
          rm -f publish/web/wwwroot/index.html.br publish/web/wwwroot/index.html.gz
          echo "${VERSAO}" > publish/web/wwwroot/version.txt
          mkdir -p site
          rsync -a --exclude '*.br' --exclude '*.gz' publish/web/wwwroot/ site/
      - name: Publicar prévia no Cloudflare Pages (não é a versão oficial)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          npx --yes wrangler@3 pages deploy site --project-name casillas-code --branch "${GITHUB_REF_NAME}" --commit-dirty=true
          ALIAS=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          echo "### Prévia web: https://${ALIAS}.casillas-code.pages.dev" >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: testes
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Executável de teste para Windows
        run: >
          dotnet publish src/CncStudio.App/CncStudio.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/teste-win-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CasillasCode-teste-${{ github.ref_name }}
          path: publish/teste-win-x64
          retention-days: 14

  # Comentário único no PR com o link da prévia do Windows. Job à parte: a permissão de escrita no PR fica só aqui
  # e uma falha do comentário não deixa a Prévia vermelha. Sem PR aberto para o ramo, não faz nada.
  comentario:
    needs: windows
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RAMO: ${{ github.ref_name }}
      RUN_ID: ${{ github.run_id }}
      SHA: ${{ github.sha }}
    steps:
      - name: Comentar a prévia no PR
        run: |
          PR=$(gh pr list --repo "$REPO" --head "$RAMO" --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then echo "Sem PR aberto para $RAMO: nada a comentar."; exit 0; fi
          ART=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("CasillasCode-teste-")) | .id' | head -n1)
          if [ -n "$ART" ]; then LINK="https://github.com/$REPO/actions/runs/$RUN_ID/artifacts/$ART"; else LINK="https://github.com/$REPO/actions/runs/$RUN_ID"; fi
          printf '%s\n' '<!-- previa-teste -->' \
            "**Prévia do Windows** (commit \`${SHA:0:7}\`): [baixar o .exe de teste]($LINK)" \
            '' \
            'Ou use o atalho **Testar PR** e digite o número deste PR. O arquivo vale por 14 dias.' > corpo.md
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '[.[] | select(.body | startswith("<!-- previa-teste -->"))][0].id // empty' | head -n1)
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@corpo.md > /dev/null
          else gh pr comment "$PR" --repo "$REPO" --body-file corpo.md; fi
